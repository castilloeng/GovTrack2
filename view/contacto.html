<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GovTrack</title>
  <!-- Bootstrap CSS local -->
  <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <!-- Botón Back -->
  <a href="index.html" class="btn btn-sm btn-outline-secondary mb-3">
    ← Back
  </a>
  <h1 class="mb-4">Operadores</h1>

  <!-- Filtro con Bootstrap -->
  <div class="input-group mb-3">
    <input id="filtro" type="text" class="form-control" placeholder="Filtrar por nombre">
    <button class="btn btn-primary" onclick="cargarContactos()">Buscar</button>
  </div>

  <!-- Tabla con Bootstrap -->
  <table class="table table-striped table-bordered">
    <thead class="table-light">
      <tr>
        <th>Nombre</th>
        <th>Teléfono</th>
      </tr>
    </thead>
    <tbody id="tabla-contactos"></tbody>
  </table>

  <!-- Controles de paginación -->
<nav>
  <ul class="pagination justify-content-center" id="paginacion"></ul>
</nav>

  <!-- Bootstrap JS local -->
  <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../js/contacto.js"></script>
</body>
</html>
