<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GovTrack</title>
  <!-- Bootstrap CSS local -->
  <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
</head>
<body class="container mt-4">

  <!-- Botón Back -->
  <a href="index.html" class="btn btn-sm btn-outline-secondary mb-3">
    ← Regresar
  </a>

  <h1 class="mb-4">Detalle de Contactos</h1>

  <!-- Filtros con Bootstrap -->
  <div class="row mb-3">
    <div class="col-md-4">
      <select id="filtro-municipio" class="form-select" onchange="cargarContactosDet()">
        <option value="">Todos los municipios</option>
      </select>
    </div>
    <div class="col-md-8">
      <div class="input-group">
        <input id="filtro" type="text" class="form-control" placeholder="Filtrar por nombre">
        <button class="btn btn-primary" onclick="cargarContactosDet()">Buscar</button>
      </div>
    </div>
  </div>

  <!-- Tabla con Bootstrap -->
  <table class="table table-striped table-bordered">
    <thead class="table-light">
      <tr>
        <th>NOMBRE</th>
        <th>TELEFONO</th>
        <th>COLONIA</th>
        <th>SECCION</th>
        <th>NUM_PERSONAS</th>
        <th>OBSERVACIONES</th>
        <th>OPERADOR_ENLACE</th>
        <th>TELEFONO</th>
        <th>OPERADOR_ENLACE</th>
        <th>TELEFONO</th>
      </tr>
    </thead>
    <tbody id="tabla-contactosdet"></tbody>
  </table>

  <!-- Paginación compacta -->
  <nav>
    <ul class="pagination justify-content-center" id="paginacion"></ul>
  </nav>

  <!-- Bootstrap JS local -->
  <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../js/contactodet.js"></script>
</body>
</html>
