<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GovTrack</title>
  <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
</head>
<body class="container mt-4">

  <!-- Botón Back -->
  <a href="index.html" class="btn btn-sm btn-outline-secondary mb-3">← Regresar</a>

  <h1 class="mb-4">Alta de Operadores</h1>

  <form id="formOperador" class="needs-validation" novalidate>
    <div class="mb-3">
      <label for="municipio" class="form-label">Municipio:</label>
      <select id="municipio" class="form-select"></select>
    </div>

    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre:</label>
      <input id="nombre" type="text" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="telefono" class="form-label">Teléfono:</label>
      <input id="telefono" type="text" class="form-control" required>
    </div>

    <div class="d-flex gap-2">
      <button type="button" class="btn btn-outline-secondary" onclick="window.location.href='index.html'">Cancelar</button>
      <button type="button" class="btn btn-primary" onclick="guardarOperador()">Guardar</button>
    </div>
  </form>

  <div id="mensaje" class="mt-3"></div>

  <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../js/operadores_alta.js"></script>
</body>
</html>
